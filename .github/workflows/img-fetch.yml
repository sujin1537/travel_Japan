name: img-fetch
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add p
          git commit -m "fetched images" || echo nothing
          git push
