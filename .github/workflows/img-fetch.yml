name: img-fetch
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node scrape.js
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add g; git commit -m "gallery images" || echo nothing; git push
