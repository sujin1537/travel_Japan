name: img-fetch
on:
  push:
    branches: [img-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p stay
          while read name url; do
            [ -z "$name" ] && continue
            curl -sSL -A "Mozilla/5.0" -e "https://www.jalan.net/" -o "stay/$name.jpg" "$url" || echo "fail $name"
            file "stay/$name.jpg"
          done < img-list.txt
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stay
          git commit -m "fetched images" || echo nothing
          git push
